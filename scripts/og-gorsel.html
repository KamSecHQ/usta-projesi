<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- Paylaşım görseli şablonu (1200×630). Üretmek için: npm run og-gorsel -->
<link rel="stylesheet" href="../node_modules/@fontsource-variable/plus-jakarta-sans/index.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans Variable', sans-serif; color: #fff; position: relative; -webkit-font-smoothing: antialiased; }
  .yildizlar { position: absolute; inset: 0; opacity: .7;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 14%, #fff, transparent 60%), radial-gradient(1px 1px at 22% 38%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(1.2px 1.2px at 41% 9%, #fff, transparent 60%), radial-gradient(1px 1px at 57% 27%, rgba(196,181,253,.8), transparent 60%),
      radial-gradient(1.4px 1.4px at 73% 12%, #fff, transparent 60%), radial-gradient(1px 1px at 88% 31%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(1px 1px at 94% 8%, #fff, transparent 60%), radial-gradient(1px 1px at 33% 21%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(1.2px 1.2px at 64% 44%, rgba(255,255,255,.55), transparent 60%), radial-gradient(1px 1px at 14% 52%, rgba(196,181,253,.7), transparent 60%); }
  svg.kure { position: absolute; left: 50%; top: 258px; transform: translateX(-50%); }
  .ust { position: absolute; left: 64px; right: 64px; top: 52px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 30px; font-weight: 800; letter-spacing: .01em; }
  .hap { font-size: 17px; font-weight: 600; padding: 11px 20px; border-radius: 999px; background: #FDFDFD; color: #050505; }
  h1 { position: absolute; left: 0; right: 0; top: 150px; margin: 0; text-align: center; font-size: 82px; font-weight: 500; line-height: 1.02; letter-spacing: -.02em; }
  p { position: absolute; left: 0; right: 0; top: 345px; margin: 0; text-align: center; font-size: 25px; font-weight: 400; color: #D4D4D8; letter-spacing: -.005em; }
  .alt { position: absolute; left: 0; right: 0; bottom: 46px; text-align: center; font-size: 19px; font-weight: 600; color: #C4B5FD; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="yildizlar"></div>
  <svg class="kure" width="1500" height="1560" viewBox="0 0 1500 1560" aria-hidden="true">
    <defs>
      <pattern id="nokta" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="1.7" fill="#B9A6FF" /></pattern>
      <radialGradient id="ic" cx="50%" cy="18%" r="70%"><stop offset="0" stop-color="#5B3FD0" stop-opacity=".55" /><stop offset=".55" stop-color="#2A1A6E" stop-opacity=".35" /><stop offset="1" stop-color="#000" stop-opacity="0" /></radialGradient>
      <radialGradient id="soluk" cx="50%" cy="0%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".95" /><stop offset=".6" stop-color="#fff" stop-opacity=".25" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
      <mask id="maske"><rect y="60" width="1500" height="1500" fill="url(#soluk)" /></mask>
      <filter id="isilti" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18" /></filter>
    </defs>
    <circle cx="750" cy="810" r="740" fill="none" stroke="#8B5CF6" stroke-width="34" opacity=".55" filter="url(#isilti)" />
    <circle cx="750" cy="810" r="738" fill="url(#ic)" />
    <circle cx="750" cy="810" r="736" fill="url(#nokta)" mask="url(#maske)" opacity=".55" />
    <circle cx="750" cy="810" r="738" fill="none" stroke="#C4B5FD" stroke-width="2.5" opacity=".9" />
  </svg>
  <div class="ust"><span class="logo">Kalfahane</span><span class="hap">kalfahane.com</span></div>
  <h1>İşini emin ellere<br>teslim et.</h1>
  <p>Doğrulanmış Türk yazılımcılarla işletmeleri buluşturan çarşı.</p>
  <div class="alt">TÜRKİYE'NİN YAZILIM ÇARŞISI</div>
</body>
</html>
